<!DOCTYPE html> <!--เสนอความคิดเห็น https://reg.mju.ac.th/registrar/suggestion.asp?avs178238701=14-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เสนอความคิดเห็น</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="navbar bg-base-100 shadow-sm navbar-center bg-green-400">
        <div class="flex-1 ">
            <a href="https://reg.mju.ac.th/registrar/home.asp"><img
                    src="https://www.mju.ac.th/th/images/mju_logo_main-resize.png"
                    class="h-8 w-auto sm:h-10 md:h-12"></a>
        </div>
        <div class="flex-none ">
            <ul class="menu menu-horizontal px-1 gap-3">
                <li><a class="btn">เมนูหลัก</a></li>
                <li><a class="btn">Log in</a></li>
            </ul>
        </div>
    </div>
    <div class="breadcrumbs text-sm pl-4">
        <ul>
            <li><a>เมนูหลัก</a></li>
            <li><a href="index.html">วิชาที่เปิดสอน</a></li>
            <li><a href="secondpage.html">ตารางเรียนนักศึกษา</a></li>
            <li><a>เสนอความคิดเห็น</a></li>
        </ul>
    </div>
    <div class="flex flex-col items-center gap-6">
        <h2 class="text-3xl font-bold">เสนอความคิดเห็น </h2>
        <div class="flex items-center gap-3">
            <label class="w-28 text-right">หมวดหมู่</label>
            <select class="select">
                <option disabled selected>--เลือกหมวดหมู่--</option>
                <option>ข้อเสนอแนะ</option>
                <option>ร้องเรียน</option>
                <option>สอบถาม</option>
                <option>อื่นๆ</option>
            </select>
        </div>
        <div class="relative w-full max-w-md">
            <textarea id="myTextarea" placeholder="ใส่ข้อความที่นี่" class="textarea textarea-accent w-full pb-6 h-48"
                maxlength="500" oninput="updateCount()"></textarea>
            <span id="charCount" class="absolute bottom-2 right-3 text-xs text-gray-400 pointer-events-none">
                0/500
            </span>
        </div>
        <script>
            function updateCount() {
                const textarea = document.getElementById('myTextarea');
                document.getElementById('charCount').textContent = textarea.value.length + '/500';
            }
        </script>
        <div class="flex flex-row items-center gap-6">
            <span class="whitespace-nowrap">ต้องการถาม</span>
            <label class="select w-[bg-base-100]">
                <select>
                    <option>--ไม่ระบุ--</option>
                    <option>อาจารย์ อรรถวิท ชังคมานนท์</option>
                    <option>อาจารย์ อลงกต กองมณี</option>
                    <option>ผศ. ดร. ปวีณ เขื่อนแก้ว</option>
                </select>
            </label>
        </div>

        <div id="statusMsg"  class="hidden alert alert-success w-full max-w-md">
            <span>✅ ส่งความคิดเห็นเรียบร้อยแล้ว!</span>
        </div>
        <div id="failmsg" class="hidden alert alert-error w-full max-w-md">
            <span>❎ กรุณาใส่ข้อความก่อนส่ง</span>
        </div>

        <button class="btn bg-green-400 btn-wide" onclick="submitForm()">ส่ง</button>

        <script>
            function submitForm() {
                const msg = document.getElementById('myTextarea').value;
                if (!msg.trim()) {
                    document.getElementById('statusMsg').classList.add('hidden');
                    document.getElementById('failmsg').classList.remove('hidden');
                    return;
                }
                document.getElementById('failmsg').classList.add('hidden');
                document.getElementById('statusMsg').classList.remove('hidden');
                document.getElementById('myTextarea').value = '';
                document.getElementById('charCount').textContent = '0/500';
            }
        </script>
    </div>
</body>

</html>
